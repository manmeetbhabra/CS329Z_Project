# Manual corrections applied to the normalized raw extraction to produce the gold set.
# Each edit: file (gold output name), find (exact, must match once), replace, note.
# Checked against rendered PDF pages. Footnote markers that the PDF prints as superscripts
# are written as " [n]" so they cannot be misread as digits (e.g. "50.52" is 50.5 + note 2).

# ---------------------------------------------------------------- body: cover and headings
- file: body.md
