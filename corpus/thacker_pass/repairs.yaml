- id: R-15
  gap: KG-15
  note: The 3H:1V commitment now excepts the remaining pit highwall.
  file: body.md
  find: Reclaimed slope surfaces associated with the Project will have slopes of 3H:1V or less.
  replace: With the exception of the remaining portion of the pit highwall, which will be contoured at closure as
    described in Section 6.5.2, reclaimed slope surfaces associated with the Project will have slopes of 3H:1V or
    less. The remaining highwall will be left at the bedrock overall slopes described in Section 3.4. Geotechnical
    analysis of the final pit walls, based on rock mass characterization from core drilling, laboratory strength
    testing of the claystone, ash and basalt units, and limit-equilibrium stability modeling, indicates that the
    remaining highwall will be stable in the long term under static and seismic loading. Because backfill buttresses
    the lower pit walls, the exposed portion is limited to the upper benches, which are bedrock and will not be
    revegetated.
