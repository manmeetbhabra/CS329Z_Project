- id: R-12
  gap: KG-12
  note: 'Chance-find procedure: stop work, protect, notify BLM; human remains; paleontology.'
  file: body.md
  find: Project employees and contractors will be informed on how to proceed with chance finds.
  replace: If previously unidentified cultural or paleontological resources are discovered during Project activities,
    all work within 100 feet of the discovery will stop immediately and the area will be protected from further
    disturbance. LNC will notify the BLM authorized officer immediately by telephone, with written confirmation,
    and work in the area will not resume until the BLM authorizes it. If human remains or funerary objects are found,
    LNC will also notify the Humboldt County Sheriff and will follow the Native American Graves Protection and Repatriation
    Act (43 CFR 10) and NRS 383. Fossil localities identified during baseline surveys or during construction will
    be avoided where feasible; significant fossils that cannot be avoided will be recovered by a BLM-permitted paleontologist.
- id: R-13
  gap: KG-13
  note: Economic and safety factors of pit backfill.
  file: body.md
  find: The backfill plan was optimized by contouring the remaining highwall at closure to blend with surrounding
    topography, promote proper drainage, and avoid ponding.
  replace: The backfill plan was optimized by contouring the remaining highwall at closure to blend with surrounding
    topography, promote proper drainage, and avoid ponding. Backfilling is also favored on economic and safety grounds.
    Placing waste rock and coarse gangue in mined-out portions of the pit shortens haul distances compared with
    hauling all material to the WRSFs, reduces the footprint and height of the WRSFs and the associated reclamation
    cost, and is incorporated in the mine plan's cost basis. Backfill buttresses the lower pit walls and leaves
    only a portion of the highwall exposed at closure, reducing long-term slope stability and public safety risks;
    backfill placement will follow MSHA requirements for dump-edge berms and equipment operation.
