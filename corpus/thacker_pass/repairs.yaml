# Repairs that turn the gold set into gold_clean/: a DEVELOPMENT-ONLY variant of Thacker Pass in which
# the published plan's known gaps (bench/labels/thacker_pass.yaml, known_gaps) are fixed with plausible
# plan text written for this project. It is not LNC's text. Official scores use the unrepaired gold set.
# Each repair: id, gap (KG id), note, file, find (exact, must match once), replace.
# Rules: reuse values already in the plan; add no value that a flaw spec edits; add no monitoring
# frequency (TP-012, TP-018). Apply with: uv run python -m prep.build_clean corpus/thacker_pass

- id: R-01
  gap: KG-01
  note: Adds riparian mitigation (new §6.4.9) for the five seasonal springs and wetlands.
  file: body.md
  find: |
    ### 6.5 Facility Reclamation Practices
  replace: |
    #### 6.4.9 Riparian Areas and Springs

    Five seasonal springs (SP-001, SP-002, SP-058, SP-059 and SP-061) and associated wet meadow vegetation occur within the Project area (Section 2.2.8), along with the small non-jurisdictional wetlands identified during baseline surveys (Section 2.3.4). Project facilities have been sited to avoid these features where practicable. Before construction, LNC will mark a buffer of at least 100 feet around each spring outside the disturbance footprint, and BMPs described in the SWPPP (Appendix C) will protect them from sediment and runoff. Flow and water quality at selected springs are monitored under the surface water monitoring program (Appendix I), and the condition of riparian vegetation at those springs will be documented during the same visits.

    Where a spring or its riparian vegetation is disturbed by the Project, LNC will mitigate the loss at closure by regrading to restore drainage to the spring area, planting and seeding with native wetland and wet meadow species approved by the BLM, and installing temporary fencing to keep livestock out until vegetation is established. Where on-site restoration is not feasible, LNC will, in coordination with the BLM, enhance riparian habitat at springs elsewhere in the Kings River or Quinn River watersheds, for example by fencing spring sources with exclosures and restoring degraded spring outflow channels.

    ### 6.5 Facility Reclamation Practices
