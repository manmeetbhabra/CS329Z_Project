  note: Water balance and groundwater impact analysis summarized instead of deferred.
  file: body.md
  find: is currently being analyzed, and the report is anticipated to be submitted to the BLM in August 2019.
  replace: was analyzed using the numerical groundwater flow model developed by Piteau Associates for the Project,
    and the results were submitted to the BLM in August 2019. Consumptive use of approximately 2,600 AF per year
    in Phase 1 and 5,200 AF per year in Phase 2 consists primarily of steam and sulfuric acid production, moisture
    retained in the clay tailings placed in the CTFS, evaporation from the reclaim ponds, and dust suppression;
    process water is recycled to the extent practicable. The model predicts that drawdown from pumping at the Quinn
    Production Well, about seven miles from the Project area, will not extend to the seasonal springs within the
    Project area, and that pit dewatering will be minor and limited to late in the mine life.
