- id: R-09
  gap: KG-09
  note: Stabilization measures for excavations during temporary closure (no frequency, see TP-018).
  file: appendix_H.md
  find: No additional measures would be necessary to stabilize excavations and workings during an unplanned temporary
    closure.
  replace: During an unplanned temporary closure, LNC would maintain the safety berms along the pit perimeter and
    at the top of access ramps, scale loose material from active faces before the closure begins, and keep pit sumps
    and drainage channels clear so that water does not pond against the toe of the pit walls. Pit walls, benches
    and ramps would be inspected periodically for tension cracks, raveling or other signs of instability, and any
    unstable area would be barricaded and repaired before work resumes.
