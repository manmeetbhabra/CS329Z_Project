# Real weaknesses in the published plan. Scoring: a flag matching one of these (same
# checklist_id, or same location and type) is counted as a known-gap hit, not a false alarm.
known_gaps:
  - id: KG-01
    type: missing
    checklist_ids: [rec-riparian]
    description: No riparian mitigation, although five seasonal springs (SP-001, SP-002, SP-058, SP-059, SP-061) lie in the Project area.
    locations: [{file: body.md, section: "2.2.8", pages: [23]}]
  - id: KG-02
    type: inconsistent
    checklist_ids: [cost-estimate]
    description: §6.1 and §6.10.1 say costs "are included in" / "contains costs for" the Reclamation Cost Estimate (Appendix J), but Appendix J and §6.14 say the estimate will be prepared later.
    locations: [{file: body.md, section: "6.1", pages: [104]}, {file: body.md, section: "6.10.1", pages: [122]}, {file: appendix_J.md, pages: [1]}]
  - id: KG-03
    type: inconsistent
    checklist_ids: [ops-water-management, rec-erosion-runoff]
    description: §5.1 Stormwater Management Plan lists objectives copied from the Emergency Response Plan ("Provide for an effective response to emergency situations", "Minimize property and equipment losses", ...).
    locations: [{file: body.md, section: "5.1", pages: [100]}]
  - id: KG-04
    type: inconsistent
    checklist_ids: [rec-acid-toxic-control]
    description: §6.7 says the CTFS cover is "described in Section 6.5.8"; CTFS reclamation is §6.5.9 (6.5.8 is Process Plant Facilities).
    locations: [{file: body.md, section: "6.7", pages: [120]}]
  - id: KG-05
    type: inconsistent
    checklist_ids: [rec-pit-backfill, ops-designs]
    description: §3.4.2 refers to "Sections 3.4 and 3.8" for the WRSF and coarse gangue stockpile; the correct sections are 3.5 and 3.9 (as §5.2 states).
    locations: [{file: body.md, section: "3.4.2", pages: [49]}]
  - id: KG-06
    type: inconsistent
    checklist_ids: [ops-rock-characterization, baseline-acid-testing]
    description: §3.4.2 says test results are available for nine oxidized gangue samples (consistent with Table 3-4, 9 gangue ABA tests), but §3.5.1 says "static test and kinetic test results are available for seven (7) samples of gangue" — which also conflicts with Table 3-4's two HCT (kinetic) tests.
    locations: [{file: body.md, section: "3.4.2", pages: [50]}, {file: body.md, section: "3.5.1", pages: [58]}]
  - id: KG-07
    type: vague
    checklist_ids: [ops-water-management]
    description: Project water balance and groundwater impact analysis is deferred ("anticipated to be submitted to the BLM in August 2019").
    locations: [{file: body.md, section: "5.8", pages: [103]}]
  - id: KG-08
    type: vague
    checklist_ids: [ops-water-management]
    description: Water rights for Phase 2 (~5,200 AF/yr) are not identified. The plan holds ~995 AF and options ~2,717 AF, and says only that LNC "plans to acquire and transfer additional water rights" before Phase 2.
    locations: [{file: body.md, section: "3.21", pages: [77, 78]}]
  - id: KG-09
    type: vague
    checklist_ids: [imp-stabilize]
    description: Appendix H §2.2 states no additional measures are needed to stabilize excavations during temporary closure.
    locations: [{file: appendix_H.md, section: "2.2", pages: [5]}]
  # KG-10 retired 2026-11-06: 18,686 vs 18,618 acres (0.4%) between the survey area and the
  # soils table is likely legitimate, not a deficiency.
  - id: KG-11
    type: inconsistent
    checklist_ids: [ops-designs]
    description: CTFS design differs between the body and the SWPPP. Body §3.17 and Table 3-6 give 5H:1V exterior slopes; Appendix C §3.5 gives 3H:1V exterior (2H:1V interior) perimeter-berm slopes, 40-foot lifts and a southern buttress.
    locations: [{file: body.md, section: "3.17", pages: [71]}, {file: appendix_C.md, section: "3.5", pages: [15]}]
  - id: KG-12
    type: vague
    checklist_ids: [pf-cultural]
    description: §4.11 says only that employees and contractors "will be informed on how to proceed with chance finds" — no stop-work, protect-in-place or notify-BLM procedure, and no paleontological measures despite the section title.
    locations: [{file: body.md, section: "4.11", pages: [96, 97]}]
  - id: KG-13
    type: vague
    checklist_ids: [rec-pit-backfill]
    description: The pit backfill discussion covers environmental factors (no pit lake, gangue geochemistry) but gives no safety or economic analysis of backfilling.
    locations: [{file: body.md, section: "3.4.2", pages: [49, 50]}, {file: body.md, section: "6.5.2", pages: [112]}]
  - id: KG-14
    type: inconsistent
    checklist_ids: [ops-water-management]
    description: Peak pit dewatering rate is ~90 gpm in the body (§3.4.1, §5.8) but ~195 gpm in the SWPPP (Appendix C §3.1).
    locations: [{file: body.md, section: "3.4.1", pages: [48]}, {file: body.md, section: "5.8", pages: [102]}, {file: appendix_C.md, section: "3.1", pages: [13]}]
  - id: KG-15
    type: inconsistent
    checklist_ids: [rec-regrading]
    description: §6.10.3 says all reclaimed slopes will be 3H:1V or less, but §3.4.2 and §6.5.2 say a portion of the pit highwall (bedrock walls at 39–47°) will remain exposed.
    locations: [{file: body.md, section: "6.10.3", pages: [123]}, {file: body.md, section: "3.4.2", pages: [49]}, {file: body.md, section: "6.5.2", pages: [112]}]
  - id: KG-16
    type: inconsistent
    checklist_ids: [ops-maps]
    description: §5.8 says process water management "is shown on Figure 13 Block Flow Diagram"; the Block Flow Diagram is Figure 14 (§3.11).
    locations: [{file: body.md, section: "5.8", pages: [103]}]
  - id: KG-17
    type: inconsistent
    checklist_ids: [ops-schedule]
    description: The Summary says mining production and ore processing commence in late 2022; §3.3.3 says mining activities commence in late 2021.
    locations: [{file: body.md, pages: [6]}, {file: body.md, section: "3.3.3", pages: [45]}]

  # KG-18 and KG-19 were found by reviewing the V1 agent's flags on the clean control (2026-11-08,
  # Notes/Planning/Agent_Plan_V1.md §7.4); confirmed against the plan text by a person.
  - id: KG-18
    type: inconsistent
    checklist_ids: [ops-schedule]
    description: A 41-year mine life with mining from late 2021 ends around 2062, but the plan gives 2065 as the end of mining and processing (Summary, §3.3.3) and as the year of mining in the southeast pit (§3.4.1, §5.8, Appendix C §3.1); Appendix C §1.4 gives 2063.
    locations: [{file: body.md, pages: [6]}, {file: body.md, section: "3.3.3", pages: [45]}, {file: body.md, section: "3.4.1", pages: [48]}, {file: body.md, section: "5.8", pages: [103]}, {file: appendix_C.md, section: "3.1", pages: [13]}, {file: appendix_C.md, section: "1.4", pages: [8]}]

  - id: KG-19
    type: vague
    checklist_ids: [pf-storm-capacity]
    description: The CTFS reclaim ponds are sized for the 100-year, 24-hour storm only; the capacity basis does not include the maximum process-solution inventory or an allowance for snowmelt and draindown (43 CFR 3809.420(b)(12)(iii)).
    locations: [{file: body.md, section: "3.17", pages: [72]}, {file: appendix_C.md, section: "4.5", pages: [21]}]

  # KG-20 and KG-21 (and KG-18's Appendix C §1.4 location) were found by reviewing the V2 agent's flags
  # on the clean control (2026-11-08, Notes/Planning/Agent_Plan_V2.md §8); confirmed against the plan text.
  - id: KG-20
    type: inconsistent
    checklist_ids: [baseline-environment]
    description: 2013 annual precipitation is 8.6 inches in the §2.3.1 text and Appendix C §1.5, but 8.8 in Table 2-1 (whose 2013 monthly values sum to 8.8).
    locations: [{file: body.md, section: "2.3.1", pages: [23]}, {file: appendix_C.md, section: "1.5", pages: [9]}]
  - id: KG-21
    type: inconsistent
    checklist_ids: [pf-impoundment-design, ops-designs]
    description: Clay tailings are dewatered to a wet-basis moisture content of approximately 19–27 percent before disposal in §3.17, but approximately 33 percent in Appendix C §3.5.
    locations: [{file: body.md, section: "3.17", pages: [71]}, {file: appendix_C.md, section: "3.5", pages: [14]}]
  - id: KG-22
    type: inconsistent
    checklist_ids: [baseline-environment]
    description: §2.3.1 says winter (December–February) precipitation in 2011–2017 ranged from 0.3 to 3.7 inches, but Table 2-1 has winter months of 0.0 (Dec 2011), 0.1 (Dec 2017) and 0.2 (Feb 2013, Feb 2016) inches.
    locations: [{file: body.md, section: "2.3.1", pages: [23]}]

