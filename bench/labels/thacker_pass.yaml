# Labels for the CLEAN Thacker Pass gold set (corpus/thacker_pass/gold/), before any flaws.
#
# Three parts:
#   items       status of every checklist item (knowledge/checklist.yaml) in the clean plan
#   known_gaps  real weaknesses already in the published plan. An agent flag that matches one
#               of these is a "known gap" hit, not a false alarm, on every test case.
#   facts       trigger facts (which checklist items apply) and key values with citations,
#               used to design inconsistent / implausible flaws.
#
# status: present | vague | missing | not_applicable
# Pages are PDF page numbers, as in the gold page markers (<!-- page N | printed P -->).
# Missing/vague flaws may only target items labeled `present`.
#
# DRAFT by Claude, 2026-11-04. Revised 2026-11-06 after an independent review: statuses of
# pf-cultural, imp-stabilize and rec-pit-backfill changed to vague; stale evidence fixed;
# KG-06 relocated; KG-08 retyped; KG-10 retired; KG-12 to KG-17 added.

