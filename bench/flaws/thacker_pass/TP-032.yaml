id: TP-032
type: implausible
difficulty: easy
checklist_ids:
- rec-revegetation
description: The seeding rate is 0.12 lb PLS/acre (one hundredth of the original 12.10), in the §6.4.4 text, Table
  6-2 and Appendix D Table 4-1; every species rate is scaled to match.
expected_finding: A seeding rate of 0.12 lb PLS/acre is far too low to establish vegetation; the seed mix cannot
  meet the revegetation goals (§6.4.4, Table 6-2, Appendix D).
tells: Species rates of 0.001–0.06 lb/acre.
rationale: Broadcast seeding of Great Basin reclamation mixes is typically 8–20 lb PLS/acre (drill seeding about
  half that); 0.12 lb/acre is roughly one seed per square foot or less.
