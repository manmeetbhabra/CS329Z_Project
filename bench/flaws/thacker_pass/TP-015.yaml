description: Liner details for the CTFS (HDPE geomembrane on 6-in. bedding, underdrain/seepage collection) and the
  reclaim ponds (double HDPE with geonet) are replaced with general statements in the body, Appendix C and Appendix
  I.
expected_finding: The CTFS and its reclaim ponds hold leachable tailings drainage, but no liner type, liner system,
  seepage collection or leak detection is described for them (§3.17, §5.8, §6.5.9; Appendix C §3.5, §4.5; Appendix
  I §2.5). Only the plant emergency pond's liner is still described.
tells: The text still calls the CTFS a 'lined' facility, but nowhere says with what.
edits:
- file: body.md
  find: The CTFS will be fully lined with an HDPE geomembrane, underlain with a six-inch liner bedding material.
    The facility will include an underdrain collection system above the geomembrane to collect drainage from the
    stack. Drainage from the stack will report to the geomembrane lined reclaim ponds.
  replace: The base of the CTFS will be prepared to contain drainage from the stack, which will report to the reclaim
    ponds.
- file: body.md
  find: The reclaim ponds will be double lined with an HDPE geomembrane separated by a layer of geonet. Water collected
