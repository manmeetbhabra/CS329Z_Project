    that will support the post-mining land use. The mix is designed to provide species that can exist in the environment
    of northwestern Nevada, are proven to be robust species for revegetation, or are native species found in the
    plant communities prior to disturbance. Broadcast seeding will be at a rate of approximately 12.10 pounds of
    pure live seed per acre. If approved by the BLM, LNC will use this proposed seed mix in conjunction with coated
