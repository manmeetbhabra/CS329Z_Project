id: TP-011
type: vague
difficulty: easy
checklist_ids:
- rec-revegetation
description: The seed mix (Table 6-2 / Appendix D Table 4-1) and the 12.10 lb PLS/acre seeding rate are replaced
  with a statement that the mix and rates will be developed later.
expected_finding: The revegetation plan gives no seed mix, species or seeding rate; it says these will be determined
  later (§6.4.4 and Appendix D).
tells: Several sections still say to seed 'using the seed mix presented in Table 6-2', which no longer exists.
edits:
- file: body.md
  find: The proposed reclamation seed mix for the Project (Table 6-2) was developed for the Project location through
    coordination with the University of Nevada, Reno. The seed mix is especially adapted for the Project site’s
    clay soils. The mix is based on known soil and climatic conditions and was selected to <!-- page 109 | printed
    91 --> establish a plant community that will support the post-mining land use. The mix is designed to provide
    species that can exist in the environment of northwestern Nevada, are proven to be robust species for revegetation,
    or are native species found in the plant communities prior to disturbance. Broadcast seeding will be at a rate
    of approximately 12.10 pounds of pure live seed per acre. If approved by the BLM, LNC will use this proposed
    seed mix in conjunction with coated seed technology being developed by Brigham Young University and the Great
    Basin Sagebrush Restoration Fund at University of Nevada Reno. The coated seed technology improves seed germination
    and plant establishment efficacy. LNC will coordinate any changes or adjustments to the reclamation seed list
    or application rate in consultation with, and approval by, BLM and NDEP.
  replace: A reclamation seed mix for the Project will be developed at a later date and will consist of species
    appropriate for the Project site. Seeding rates will be determined as appropriate. LNC will coordinate the seed
    list and application rate in consultation with, and approval by, BLM and NDEP. <!-- page 109 | printed 91 -->
- file: body.md
  find: |+
    Table 6-2 Proposed Reclamation Seed Mix

    | Variety | Species | Pure Live Seed (pounds/acre) |
    |---|---|---|
    | Wyoming Big Sagebrush | Artemisia tridentate spp. Wyomingensis | 1.00 |
    | Fourwing Saltbush | Atriplex canescens | 0.50 |
    | Squirreltail | Elymus elymoides | 2.75 |
    | Sandberg's Bluegrass | Poa secunda | 1.00 |
    | Crested Wheatgrass | Agropyron cristatum | 6.00 |
    | Blue Flax | Linum lewisii | 0.50 |
    | Scarlet globemallow | Sphaeralcea coccinea | 0.25 |
    | Western Yarrow | Achillia millifolium | 0.10 |
    |  | Total | 12.10 |

    Note: [1] Seed mixtures may change from time to time during concurrent and final reclamation. The changes will be based on targeting specific soil/disturbance types and experience gained during concurrent reclamation during the life of the Project, on test plot results, and changes in agency recommendations.

  replace: ''
