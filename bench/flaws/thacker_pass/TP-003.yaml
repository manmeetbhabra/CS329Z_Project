    ### 6.8 Drill Hole Plugging and Water Well Abandonment

    In accordance with applicable rules and regulations (NAC 534.425 through 534.428), reclamation of mineral drill holes (i.e., exploration and development) and wells (i.e., monitoring and production)

    <!-- page 121 | printed 103 -->

    subject to NDWR standards will require proper abandonment methodology. Abandonment of each exploration drill hole will occur upon completion of drilling operations and prior to the removal of the drill rig from the drill site.

    Abandonment techniques will include mixing a bentonite and freshwater slurry or cement grout, specifically formulated for well or drill hole abandonment. The mixture will be circulated through the drill pipe and distributed from the bottom of the drill hole in a manner that will assure against the vertical movement of groundwater. The mixture will also be placed in the annular space surrounding any casing left down the hole.

    If circulation from the bottom is not possible, drill hole abandonment will entail mixing the slurry or grout at the surface, circulating the mixture through the drill pipe from the bottom of the drill hole under pressure and placed in stages as the drill pipe is retrieved from the drill hole. A cement surface plug, comprised of Portland cement mixed with clean water and aggregates or bagged cement mixed with clean water, will be placed within the top 20 feet of each drill hole. The top of the surface plug will be placed below the ground surface to eliminate physical hazards, to prevent ponding of water directly over the drill hole, allow for placement of growth media, and allow for passage of earthmoving equipment required for reclamation operations. Remaining surface casing will also be removed below the ground surface and the annulus of any casing left down hole is sealed in a manner that assures against the movement of surface water down the drill hole.

    Maintenance of monitoring wells around process facilities will continue until LNC is released of this requirement by NDEP. These wells will then be plugged and abandoned according to the requirements stated in NAC 534.425 through 534.428.

