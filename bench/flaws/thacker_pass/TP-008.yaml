description: Every statement that the reclaim ponds and the emergency pond are fenced to exclude wildlife is removed
  (five sentences across §3.10, §3.17, §3.24.6 and §4.6, one in Appendix C §4.5), and Appendix I §3.3 no longer
  monitors 'wildlife exclusion features'.
expected_finding: The CTFS reclaim ponds and emergency pond hold process solutions, but no measure excludes wildlife,
