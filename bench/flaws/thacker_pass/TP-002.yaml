  find: |+
    #### 6.5.16 Disposition of Buildings

    LNC will demolish buildings associated with the Project and properly dispose of parts offsite. Foundations will be broken and hauled to the Class III debris disposal area located in the West WRSF (Figure 10). LNC will regrade, rip, and seed the building footprint areas with the proposed seed mix (Table 6-2).

    Ground surfaces will be inspected for evidence of possible soil contamination prior to removal of the buildings and concrete. Any affected soils as determined by visual inspection, lab analysis, or other method will be excavated and properly treated and disposed of in the appropriate onsite or offsite location.

